<!DOCTYPE html>
<html>
<head>
    <title>Referrer</title>
</head>
<body>

<div id="info">Loading...</div>

<script>
function displayInfo() {
    const referrer = document.referrer || "No Referrer Found (Browser blocked or direct visit)";
    let html ="<p><b>Referrer:</b> " + referrer + "</p>";
    document.getElementById("info").innerHTML = html;
}
displayInfo();
</script>
</body>
</html>
